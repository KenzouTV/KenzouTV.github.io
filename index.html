:root{

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{

.wrap{

nav.topbar{

  padding:12px 18px;

.brand{

}

}

.brand .title{
  font-weight:700;
}

.navlinks{
  display:flex;
  gap:12px;
  align-items:center;
}

.navlinks a{
  padding:8px 14px;
  border-radius:12px;

}

.navlinks a.active{

}

.btn-discord{

}

.lead{

.profile-square{

footer{

  }

}

  </style>
</head>

</div>

<script>

document
.getElementById('btnDiscord')

  window.open(

  );

const burger = document.getElementById('burger');
