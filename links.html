<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Mes Réseaux — KenzouTV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg-1:#05070b;
  --bg-2:#071018;

  --accent:#ff7a18;
  --accent-2:#ff9b3b;

  --text:#f3f6ff;
  --muted:rgba(255,255,255,0.65);

  --glass:rgba(7,16,24,0.88);

  --max-w:1180px;
}

html,body{
  min-height:100%;
}

body{
  font-family:Inter,system-ui,Arial;
  color:var(--text);

  background:
    radial-gradient(900px 400px at 10% 80%, rgba(255,122,24,0.06), transparent 10%),
    radial-gradient(900px 500px at 90% 20%, rgba(255,155,59,0.04), transparent 10%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2));

  background-size:200% 200%;

  -webkit-font-smoothing:antialiased;

  padding:0 24px 48px;
}

.wrap{
  width:100%;
  max-width:var(--max-w);
  margin:0 auto;
  padding-top:28px;
}

/* NAVBAR */

.topbar{
  width:100%;
  max-width:var(--max-w);

  margin:0 auto 26px auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px 18px;

  border-radius:28px;

  background:var(--glass);

  border:1px solid rgba(255,255,255,0.03);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:44px;
  height:44px;
  border-radius:10px;
  object-fit:cover;
}

.brand .title{
  font-size:1.15rem;
  font-weight:800;
  color:white;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:10px;
}

.navlinks a{
  text-decoration:none;
  color:rgba(255,255,255,0.72);

  font-weight:700;

  padding:10px 14px;

  border-radius:12px;

  transition:0.2s;
}

.navlinks a:hover{
  color:white;
}

.navlinks a.active{
  background:rgba(255,255,255,0.06);
  color:white;
}

.btn-discord{
  border:none;
  cursor:pointer;

  padding:10px 18px;

  border-radius:12px;

  font-weight:800;

  background:linear-gradient(180deg,var(--accent),var(--accent-2));

  color:#071018;

  box-shadow:0 6px 18px rgba(255,122,24,0.15);
}

/* HEADER */

header{
  margin-bottom:24px;
}

header h1{
  font-size:3rem;
  line-height:1;
  margin-bottom:10px;
}

header p{
  color:var(--muted);
  font-size:1.05rem;
}

/* GRID */

.links-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.link-card{
  background:rgba(255,255,255,0.02);

  border:1px solid rgba(255,255,255,0.04);

  border-radius:20px;

  padding:18px;

  box-shadow:0 20px 50px rgba(0,0,0,0.45);

  transition:0.2s;
}

.link-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,122,24,0.25);
}

.link-head{
  display:flex;
  align-items:center;
  gap:14px;

  margin-bottom:18px;
}

.icon{
  width:64px;
  height:64px;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,0.03);

  border:1px solid rgba(255,255,255,0.05);

  font-size:1.7rem;
}

.link-title{
  font-size:1.35rem;
  font-weight:800;
  margin-bottom:4px;
}

.link-desc{
  color:var(--muted);
  font-size:0.95rem;
}

.link-actions{
  display:flex;
  gap:10px;
}

.open-btn{
  flex:1;

  text-decoration:none;
  text-align:center;

  padding:12px;

  border-radius:12px;

  background:linear-gradient(180deg,var(--accent),var(--accent-2));

  color:#071018;

  font-weight:800;
}

.copy-btn{
  border:none;

  background:transparent;

  border:1px solid rgba(255,255,255,0.08);

  color:white;

  padding:12px 16px;

  border-radius:12px;

  cursor:pointer;

  font-weight:700;
}

/* FOOTER */

footer{
  margin-top:28px;
  text-align:center;
  color:rgba(255,255,255,0.18);
}

/* TOAST */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  background:linear-gradient(180deg,var(--accent),var(--accent-2));

  color:#071018;

  padding:12px 16px;

  border-radius:12px;

  font-weight:800;

  display:none;

  z-index:999;
}

/* RESPONSIVE */

@media(max-width:980px){

  .links-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:720px){

  body{
    padding:0 16px 40px;
  }

  .topbar{
    flex-direction:column;
    gap:18px;
  }

  .navlinks{
    flex-wrap:wrap;
    justify-content:center;
  }

  .links-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:2.2rem;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <nav class="topbar">

    <div class="brand">
      <img src="profile-0.png" alt="logo">
      <div class="title">KenzouTV</div>
    </div>

    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="links.html" class="active">Mes Réseaux</a>
      <a href="boutique.html">Boutique</a>
      <a href="blockframe.html">BlockFrame</a>

      <button class="btn-discord" id="btnDiscord">
        Discord
      </button>
    </div>

  </nav>

  <header>
    <h1>Mes liens officiels</h1>
    <p>Retrouve toutes mes plateformes et projets.</p>
  </header>

  <main class="links-grid">

    <article class="link-card" data-url="https://www.youtube.com/@Kenzou_TV">
      <div class="link-head">
        <div class="icon">▶</div>

        <div>
          <div class="link-title">YouTube</div>
          <div class="link-desc">Chaîne principale & vidéos</div>
        </div>
      </div>

      <div class="link-actions">
        <a href="#" class="open-btn" data-open>Ouvrir</a>
        <button class="copy-btn" data-copy>Copier</button>
      </div>
    </article>

    <article class="link-card" data-url="https://discord.gg/KURpXHzRTE">
      <div class="link-head">
        <div class="icon">🎮</div>

        <div>
          <div class="link-title">Discord</div>
          <div class="link-desc">Communauté & tickets</div>
        </div>
      </div>

      <div class="link-actions">
        <a href="#" class="open-btn" data-open>Ouvrir</a>
        <button class="copy-btn" data-copy>Copier</button>
      </div>
    </article>

    <article class="link-card" data-url="https://www.instagram.com/kenzoutv/">
      <div class="link-head">
        <div class="icon">📸</div>

        <div>
          <div class="link-title">Instagram</div>
          <div class="link-desc">Photos & coulisses</div>
        </div>
      </div>

      <div class="link-actions">
        <a href="#" class="open-btn" data-open>Ouvrir</a>
        <button class="copy-btn" data-copy>Copier</button>
      </div>
    </article>

  </main>

  <footer>
    © 2026 KenzouTV
  </footer>

</div>

<div class="toast" id="toast">
  Lien copié !
</div>

<script>

const toast = document.getElementById('toast');

function showToast(text){

  toast.textContent = text;

  toast.style.display = 'block';

  setTimeout(()=>{
    toast.style.display = 'none';
  },1400);

}

document.querySelectorAll('.link-card').forEach(card=>{

  const url = card.dataset.url;

  const openBtn = card.querySelector('[data-open]');
  const copyBtn = card.querySelector('[data-copy]');

  openBtn.addEventListener('click',(e)=>{
    e.preventDefault();

    window.open(url,'_blank','noopener');
  });

  copyBtn.addEventListener('click', async ()=>{

    try{

      await navigator.clipboard.writeText(url);

      showToast('Lien copié !');

    }catch{

      showToast('Impossible de copier');

    }

  });

});

document.getElementById('btnDiscord')
.addEventListener('click',()=>{

  window.open(
    'https://discord.gg/KURpXHzRTE',
    '_blank',
    'noopener'
  );

});

</script>

</body>
</html>
