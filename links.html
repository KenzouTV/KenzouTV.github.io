<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Mes Liens — KenzouTV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#06070a;
  --accent:#ff7a18;
  --accent-2:#ff9b3b;
  --muted:rgba(255,255,255,0.68);
  --glass:rgba(7,16,24,0.88);
  --card:rgba(255,255,255,0.02);
  --max-w:1180px;
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  margin:0;
  padding:24px 24px 48px;
  font-family:Inter,system-ui,Arial;
  color:#eaf0ff;

  background:
    radial-gradient(800px 400px at 10% 80%, rgba(255,122,24,0.06), transparent 8%),
    radial-gradient(900px 450px at 90% 20%, rgba(255,155,59,0.04), transparent 8%),
    linear-gradient(180deg,var(--bg-1), #071018 60%);

  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:var(--max-w);
  margin:0 auto;
}

/* TOPBAR IDENTIQUE */

nav.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;

  padding:12px 18px;

  border-radius:30px;

  max-width:var(--max-w);
  margin:0 auto;

  position:sticky;
  top:22px;
  z-index:40;

  background:var(--glass);

  border:1px solid rgba(255,255,255,0.03);

  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);

  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:44px;
  height:44px;
  border-radius:10px;
  object-fit:cover;
}

.brand .title{
  font-weight:700;
  letter-spacing:0.4px;
  color:#eaf0ff;
}

.navlinks{
  display:flex;
  gap:12px;
  align-items:center;
}

.navlinks a{
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  color:var(--muted);
  font-weight:600;
  transition:0.2s;
}

.navlinks a:hover{
  color:#fff;
}

.navlinks a.active{
  color:#fff;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0.01)
  );
}

.btn-discord{
  background:linear-gradient(
    180deg,
    var(--accent),
    var(--accent-2)
  );

  padding:8px 16px;
  border-radius:12px;

  color:#071018;
  font-weight:800;

  border:none;
  cursor:pointer;

  box-shadow:0 6px 18px rgba(255,122,24,0.12);
}

/* HEADER */

header{
  max-width:var(--max-w);
  margin:18px auto 6px auto;
  padding:0 6px;
}

header h1{
  margin:0 0 6px 0;
  font-size:28px;
}

header p{
  margin:0;
  color:rgba(234,240,255,0.76);
}

/* GRID */

.links-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:24px;
}

/* CARD */

.link-card{
  background:var(--card);

  padding:18px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,0.02);

  box-shadow:0 12px 30px rgba(0,0,0,0.45);

  display:flex;
  flex-direction:column;
  gap:16px;

  transition:0.25s ease;
}

.link-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,122,24,0.2);
}

.link-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon{
  width:60px;
  height:60px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,0.03);

  border:1px solid rgba(255,255,255,0.04);

  flex-shrink:0;
}

.icon svg{
  width:30px;
  height:30px;
}

.link-title{
  font-size:18px;
  font-weight:800;
}

.link-desc{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

/* BUTTONS */

.link-actions{
  display:flex;
  gap:10px;
  margin-top:auto;
}

.open-btn{
  flex:1;

  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent-2)
  );

  padding:10px 12px;

  border-radius:12px;

  color:#071018;
  font-weight:800;

  text-decoration:none;
  text-align:center;

  transition:0.2s;
}

.open-btn:hover{
  transform:translateY(-2px);
}

.copy-btn{
  background:transparent;

  border:1px solid rgba(255,255,255,0.06);

  color:var(--muted);

  padding:10px 12px;

  border-radius:12px;

  font-weight:700;

  cursor:pointer;

  transition:0.2s;
}

.copy-btn:hover{
  border-color:rgba(255,255,255,0.12);
  color:#fff;
}

/* FOOTER */

footer{
  margin-top:34px;
  text-align:center;
  color:rgba(255,255,255,0.14);
  font-size:13px;
}

/* TOAST */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent-2)
  );

  color:#071018;

  padding:10px 14px;

  border-radius:12px;

  font-weight:800;

  display:none;

  z-index:3000;
}

/* RESPONSIVE */

@media(max-width:980px){

  .links-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:720px){

  .links-grid{
    grid-template-columns:1fr;
  }

  .navlinks{
    display:none;
  }

  header h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<nav class="topbar">

<div class="brand">
<img src="profile-0.png" alt="logo KenzouTV">
<div class="title">KenzouTV</div>
</div>

<div class="navlinks">
<a href="index.html">Accueil</a>
<a href="links.html" class="active">Mes Réseaux</a>
<a href="boutique.html">Boutique</a>
<a href="blockframe.html">BlockFrame</a>

<button class="btn-discord" id="btnDiscord">
Discord
</button>
</div>

</nav>

<header>
<h1>Mes liens officiels</h1>
<p>Retrouve toutes mes plateformes et projets.</p>
</header>

<main>

<section class="links-grid">

<div class="link-card">

<div class="link-head">

<div class="icon">
▶
</div>

<div>
<div class="link-title">YouTube</div>
<div class="link-desc">
Vidéos principales & projets
</div>
</div>

</div>

<div class="link-actions">
<a class="open-btn" href="https://www.youtube.com/@Kenzou_TV" target="_blank">
Ouvrir
</a>

<button class="copy-btn" data-copy="https://www.youtube.com/@Kenzou_TV">
Copier
</button>
</div>

</div>

<div class="link-card">

<div class="link-head">

<div class="icon">
🎮
</div>

<div>
<div class="link-title">Discord</div>
<div class="link-desc">
Communauté & tickets
</div>
</div>

</div>

<div class="link-actions">
<a class="open-btn" href="https://discord.gg/KURpXHzRTE" target="_blank">
Ouvrir
</a>

<button class="copy-btn" data-copy="https://discord.gg/KURpXHzRTE">
Copier
</button>
</div>

</div>

<div class="link-card">

<div class="link-head">

<div class="icon">
📸
</div>

<div>
<div class="link-title">Instagram</div>
<div class="link-desc">
Coulisses & contenus rapides
</div>
</div>

</div>

<div class="link-actions">
<a class="open-btn" href="https://instagram.com/" target="_blank">
Ouvrir
</a>

<button class="copy-btn" data-copy="https://instagram.com/">
Copier
</button>
</div>

</div>

</section>

</main>

<footer>
© 2026 KenzouTV
</footer>

</div>

<div class="toast" id="toast">
Lien copié !
</div>

<script>

document.getElementById('btnDiscord')
.addEventListener('click', ()=>{

window.open(
'https://discord.gg/KURpXHzRTE',
'_blank',
'noopener'
);

});

const toast = document.getElementById('toast');

document.querySelectorAll('.copy-btn').forEach(btn=>{

btn.addEventListener('click', async ()=>{

const text = btn.dataset.copy;

try{

await navigator.clipboard.writeText(text);

}catch{

const textarea = document.createElement('textarea');

textarea.value = text;

document.body.appendChild(textarea);

textarea.select();

document.execCommand('copy');

textarea.remove();

}

toast.style.display = 'block';

toast.style.opacity = '1';

setTimeout(()=>{

toast.style.opacity = '0';

setTimeout(()=>{
toast.style.display = 'none';
},300);

},1000);

});

});
</script>

</body>
</html>
