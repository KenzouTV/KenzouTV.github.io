```html
<!-- LINKS.HTML -->

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Mes Réseaux — KenzouTV</title>

<link rel="icon" type="image/png" href="profile-0.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-1:#06070a;
  --accent:#ff7a18;
  --accent-2:#ff9b3b;
  --muted:rgba(255,255,255,0.65);
  --max-w:1180px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:48px 24px;
  font-family:Inter,system-ui,Arial;
  color:#fff;

  background:
    radial-gradient(800px 400px at 10% 80%, rgba(255,122,24,0.06), transparent 8%),
    linear-gradient(180deg,#06070a,#071018);

  min-height:100vh;
}

.wrap{
  max-width:var(--max-w);
  margin:32px auto;
}

/* NAVBAR */

nav.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 18px;

  border-radius:30px;

  background: rgba(7,16,24,0.88);

  border:1px solid rgba(255,255,255,0.03);

  backdrop-filter: blur(10px);

  position:sticky;
  top:22px;
  z-index:40;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:44px;
  height:44px;
  border-radius:10px;
}

.navlinks{
  display:flex;
  gap:12px;
  align-items:center;
}

.navlinks a{
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  color:var(--muted);
  font-weight:600;
}

.navlinks a.active{
  color:#fff;
  background:rgba(255,255,255,0.04);
}

.btn-discord{
  background:linear-gradient(180deg,var(--accent),var(--accent-2));

  padding:8px 14px;

  border:none;

  border-radius:12px;

  font-weight:800;

  cursor:pointer;
}

#burger{
  display:none;
}

/* LINKS */

.links{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:28px;
}

.card{
  background:rgba(255,255,255,0.03);

  padding:20px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,0.04);
}

.card h3{
  margin-top:0;
}

.open-btn{
  display:inline-block;

  margin-top:10px;

  background:linear-gradient(90deg,var(--accent),var(--accent-2));

  padding:10px 14px;

  border-radius:10px;

  text-decoration:none;

  color:#000;

  font-weight:800;
}

footer{
  margin-top:40px;
  text-align:center;
  color:rgba(255,255,255,0.2);
}

@media(max-width:720px){

  #burger{
    display:block;
    background:none;
    border:none;
    color:white;
    font-size:24px;
    cursor:pointer;
  }

  .navlinks{
    display:none;

    position:absolute;

    right:24px;
    top:76px;

    flex-direction:column;

    background:rgba(7,16,24,0.95);

    padding:10px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,0.03);
  }

  .navlinks.open{
    display:flex;
  }

  .links{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="wrap">

<nav class="topbar">

  <div class="brand">
    <img src="profile-0.png">
    <div>KenzouTV</div>
  </div>

  <button
    id="burger"
    aria-expanded="false"
    aria-controls="main-nav">
    ☰
  </button>

  <div class="navlinks" id="main-nav">
    <a href="index.html">Accueil</a>
    <a href="links.html" class="active">Mes Réseaux</a>
    <a href="boutique.html">Boutique</a>
    <a href="blockframe.html">BlockFrame</a>

    <button class="btn-discord" id="btnDiscord">
      Discord
    </button>
  </div>

</nav>

<section class="links">

  <div class="card">
    <h3>YouTube</h3>
    <p>Chaîne officielle</p>

    <a
      class="open-btn"
      href="https://youtube.com/@Kenzou_TV"
      target="_blank">
      Ouvrir
    </a>
  </div>

  <div class="card">
    <h3>Discord</h3>
    <p>Serveur officiel</p>

    <a
      class="open-btn"
      href="https://discord.gg/KURpXHzRTE"
      target="_blank">
      Rejoindre
    </a>
  </div>

</section>

<footer>
© 2026 KenzouTV
</footer>

</div>

<script>

document
.getElementById('btnDiscord')
.addEventListener('click', ()=>{

  window.open(
    'https://discord.gg/KURpXHzRTE',
    '_blank'
  );

});

const burger = document.getElementById('burger');
const navlinks = document.getElementById('main-nav');

burger.addEventListener('click', ()=>{

  navlinks.classList.toggle('open');

  burger.setAttribute(
    'aria-expanded',
    navlinks.classList.contains('open')
  );

});

</script>

</body>
</html>
```
