<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boutique — KenzouTV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <meta name="description" content="Boutique — BlockFrame (KenzouTV)"/>

<style>
:root{
  --bg-1:#06070a;
  --accent:#ff7a18;
  --accent-2:#ff9b3b;
  --muted:rgba(255,255,255,0.65);
  --card-bg: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
  --glass: rgba(7,16,24,0.88);
  --max-w:1180px;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  padding:48px 24px;
  font-family:Inter,system-ui,Arial;
  color:#eaf0ff;
  -webkit-font-smoothing:antialiased;

  background:
    radial-gradient(800px 400px at 10% 80%, rgba(255,122,24,0.06), transparent 8%),
    radial-gradient(900px 450px at 90% 20%, rgba(255,155,59,0.04), transparent 8%),
    linear-gradient(180deg,var(--bg-1), #071018 60%);
  background-size:200% 200%;
  min-height:100vh;
}

.wrap{max-width:var(--max-w);margin:32px auto}

/* =======================
   TOPBAR = IDENTIQUE INDEX
   ======================= */
nav.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  border-radius:30px;

  background: rgba(7,16,24,0.88);
  border:1px solid rgba(255,255,255,0.03);

  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);

  box-shadow: 0 10px 30px rgba(0,0,0,0.6);

  position:sticky;
  top:22px;
  z-index:40;

  margin:0 auto;
  max-width:var(--max-w);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:44px;
  height:44px;
  border-radius:10px;
  object-fit:cover;
}

.brand .title{
  font-weight:700;
  color:#eaf0ff;
}

.navlinks{
  display:flex;
  gap:12px;
  align-items:center;
}

.navlinks a{
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  color:var(--muted);
  font-weight:600;
}

.navlinks a.active{
  color:#fff;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0.01)
  );
}

.btn-discord{
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  padding:8px 14px; /* IMPORTANT identique index */
  border-radius:12px;
  color:#0b0a0b;
  font-weight:800;
  border:none;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(255,122,24,0.12);
}

/* ===== reste boutique inchangé ===== */

header{
  max-width:var(--max-w);
  margin:18px auto 6px auto;
  padding:0 6px;
}

header h1{margin:0 0 6px 0;font-size:28px}
header p{margin:0;color:rgba(234,240,255,0.76)}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:18px;
}

.product{
  background:var(--card-bg);
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.02);
  box-shadow:0 12px 30px rgba(0,0,0,0.45);
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:280px;
}

.product img{width:100%;height:200px;object-fit:cover;border-radius:10px}

.primary-btn{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  padding:10px 12px;
  border-radius:10px;
  color:#071018;
  font-weight:800;
  text-decoration:none;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="wrap">

  <!-- TOPBAR IDENTIQUE INDEX -->
  <nav class="topbar">
    <div class="brand">
      <img src="profile-0.png" alt="logo KenzouTV">
      <div class="title">KenzouTV</div>
    </div>

    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="links.html">Mes Réseaux</a>
      <a href="boutique.html" class="active">Boutique</a>
      <a href="blockframe.html">BlockFrame</a>
      <button class="btn-discord" id="btnDiscord">Discord</button>
    </div>
  </nav>

  <!-- CONTENU IDENTIQUE -->
  <header>
    <h1>Boutique — Animations & PP</h1>
    <p>Prix indicatifs : 1€ à 6€ selon service.</p>
  </header>

  <!-- reste de ton site inchangé -->
  <section class="grid">
    <article class="product">
      <img src="Produit-1.jpg">
      <button class="primary-btn">Commander</button>
    </article>
  </section>

</div>

<script>
document.getElementById('btnDiscord').addEventListener('click', ()=> {
  window.open('https://discord.gg/KURpXHzRTE','_blank','noopener');
});
</script>

</body>
</html>
